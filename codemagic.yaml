workflows:
  ios_pellazgo:
    name: Pellazgo iOS Build & Release
    max_build_duration: 60

    integrations:
      app_store_connect: pellazgo_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo

      vars:
        XCODE_WORKSPACE: Runner.xcworkspace
        XCODE_SCHEME: Runner

      xcode: latest

    scripts:
      - name: Verify project structure
        script: |
          ls -R

      - name: Install CocoaPods
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          fi

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files \
            com.pellazgo.pellazgo \
            --type IOS_APP_STORE \
            --create

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
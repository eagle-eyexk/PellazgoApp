workflows:
  ios-release:
    name: Pellazgo iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: pellazgo_asc

    environment:
      node: 18
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.pellazgo.pellazgo"
        APP_NAME: "Pellazgo"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APPLE_TEAM_ID: "H4QUDPK7S3"

    scripts:
      # ──────────────────────────────────────────────────────────────
      # 1. Fix Xcode project (using the committed Python script)
      # ──────────────────────────────────────────────────────────────
      - name: Fix Xcode project signing
        script: |
          echo "🔧 Fixing Xcode project signing settings..."
          python3 fix_project.py

      # ──────────────────────────────────────────────────────────────
      # 2. Install provisioning profile manually (CRITICAL)
      # ──────────────────────────────────────────────────────────────
      - name: Install provisioning profile
        script: |
          echo "📱 Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp signing/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Provisioning profile installed:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      # ──────────────────────────────────────────────────────────────
      # 3. Set up keychain with certificate
      # ──────────────────────────────────────────────────────────────
      - name: Set up certificate
        script: |
          echo "🔐 Setting up certificate..."
          security create-keychain -p build123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build123 build.keychain
          security import signing/*.p12 -k build.keychain -P "xbGsHVMw" -A
          security set-keychain-settings -t 3600 -l build.keychain
          echo "✅ Certificate installed"

      # ──────────────────────────────────────────────────────────────
      # 4. Install dependencies & build web app
      # ──────────────────────────────────────────────────────────────
      - name: Install dependencies & build web app
        script: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline
          echo "🏗️ Building web app..."
          npm run build

      # ──────────────────────────────────────────────────────────────
      # 5. Sync Capacitor and install pods
      # ──────────────────────────────────────────────────────────────
      - name: Sync Capacitor and install pods
        script: |
          echo "🔄 Syncing Capacitor..."
          npx cap sync ios
          echo "📦 Installing CocoaPods..."
          cd ios/App && pod install --repo-update

      # ──────────────────────────────────────────────────────────────
      # 6. Build archive (with explicit signing flags)
      # ──────────────────────────────────────────────────────────────
      - name: Build archive
        script: |
          echo "🏗️ Building archive..."
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="PellazgoApp" \
            CODE_SIGN_STYLE=Manual \
            archive

      # ──────────────────────────────────────────────────────────────
      # 7. Export IPA
      # ──────────────────────────────────────────────────────────────
      - name: Export IPA
        script: |
          echo "📦 Exporting IPA..."
          cd ios/App
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ipa \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="PellazgoApp"

    artifacts:
      - build/ipa/*.ipa
      - build/App.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false